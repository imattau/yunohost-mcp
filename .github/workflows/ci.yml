name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Compile sources
        run: uv run python -m compileall -q src tests

      - name: Run tests
        run: uv run pytest -q

      - name: Build package
        run: uv build

      - name: Validate integration artifacts
        run: |
          python -m json.tool integrations/claude-code/yunohost-mcp/.claude-plugin/plugin.json >/dev/null
          python -m json.tool integrations/claude-code/yunohost-mcp/.mcp.json >/dev/null
          python -m json.tool integrations/codex/yunohost-mcp/.mcp.json >/dev/null
