name: Tag release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 0.1.1)
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Compile sources
        run: uv run python -m compileall -q src tests

      - name: Run tests
        run: uv run pytest -q

      - name: Build package
        run: uv build

  tag:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be valid semver without the v prefix: $VERSION" >&2
            exit 1
          fi

          tag="v${VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            echo "Tag already exists: ${tag}" >&2
            exit 1
          fi

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${tag}" --message "Release ${tag}"
          git push origin "${tag}"

      # A tag pushed with the default GITHUB_TOKEN does NOT trigger other
      # workflows' `on: push: tags:` (GitHub's own anti-recursion rule) -
      # publish-pypi.yml's push trigger silently never fires from the line
      # above. Dispatch it explicitly instead of duplicating its publish
      # steps here: an inline publish job in *this* workflow was tried
      # before and failed ("invalid-publisher") because PyPI's trusted
      # publisher is registered for publish-pypi.yml specifically - its
      # OIDC token's workflow_ref claim won't match any other workflow
      # file, including this one. Reusing the one already-registered
      # workflow, via the API (not a push), avoids both problems at once.
      - name: Trigger PyPI publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          gh workflow run publish-pypi.yml --ref master -f tag="${tag}"
