name: Publish MCP Registry metadata

"on":
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish without the v prefix (for example, 0.1.1)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          install -m 0755 mcp-publisher "$RUNNER_TEMP/mcp-publisher"

      - name: Authenticate to MCP Registry
        run: "$RUNNER_TEMP/mcp-publisher login github-oidc"

      - name: Set release version
        if: github.event_name == 'release' || inputs.version != ''
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          jq --arg version "$version" '.version = $version | .packages[0].version = $version' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Wait for PyPI package to be visible
        shell: bash
        run: |
          set -euo pipefail
          identifier="$(jq -r '.packages[0].identifier' server.json)"
          version="$(jq -r '.packages[0].version' server.json)"
          normalized="${identifier//-/_}"
          for attempt in $(seq 1 20); do
            if curl -fsS "https://pypi.org/simple/${identifier}/" | grep -qF "${normalized}-${version}"; then
              echo "Found ${identifier} ${version} on PyPI."
              exit 0
            fi
            echo "Attempt ${attempt}: ${identifier} ${version} not yet visible on PyPI, waiting 15s..."
            sleep 15
          done
          echo "Timed out waiting for ${identifier} ${version} to appear on PyPI." >&2
          exit 1

      - name: Publish server.json
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 5); do
            if "$RUNNER_TEMP/mcp-publisher" publish server.json; then
              exit 0
            fi
            echo "Publish attempt ${attempt} failed, retrying in 15s..."
            sleep 15
          done
          echo "All publish attempts failed." >&2
          exit 1
