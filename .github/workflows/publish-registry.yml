name: Publish MCP Registry metadata

"on":
  release:
    types:
      - published
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          install -m 0755 mcp-publisher "$RUNNER_TEMP/mcp-publisher"

      - name: Authenticate to MCP Registry
        run: "$RUNNER_TEMP/mcp-publisher" login github-oidc

      - name: Set release version
        if: github.event_name == 'release'
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          jq --arg version "$version" '.version = $version | .packages[0].version = $version' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Publish server.json
        run: "$RUNNER_TEMP/mcp-publisher" publish server.json
