[project]
name = "yunohost-mcp"
version = "0.1.0"
description = "MCP server for secure, Nostr-authenticated YunoHost administration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.1.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
yunohost-mcp = "yunohost_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yunohost_mcp"]
